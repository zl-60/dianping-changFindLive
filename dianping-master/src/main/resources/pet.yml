server:
  address: 127.0.0.1
  port: ${PET_PORT:8081}
spring:
  profiles:
    active: ${PET_PROFILE:demo}
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    initialization-mode: always
    schema: classpath:db/pet-schema.sql
pet:
  demo-auth: true
  seed-demo: true
  expiry-enabled: true
  admin-username: ${PET_ADMIN_USERNAME:petadmin}
  admin-password: ${PET_ADMIN_PASSWORD:PetDemo2026!}
---
spring:
  profiles: demo
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./.pet-data/petcare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
---
spring:
  profiles: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PET_DB_URL:jdbc:mysql://127.0.0.1:3306/petcare?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${PET_DB_USERNAME:root}
    password: ${PET_DB_PASSWORD}
pet:
  admin-password: ${PET_ADMIN_PASSWORD}
